# odyssey-sim robot. Override any key with --set key=value (unknown keys are errors).
#
# The drivetrain numbers are physical, chosen so the simulated robot has the constants measured on
# the real one with StaticCoefficientOpMode / kAOpMode (as used in FirstTest):
#   kS = 0.11265   kV = 0.000444 /(mm/s)   kA = 0.000154 /(mm/s^2)
# For a mecanum robot driving forward on all four wheels:
#   kV = 1 / freeSpeed            -> freeSpeed  = 1 / 0.000444       = 2252 mm/s
#   kA = mass / (4 * stallForce)  -> stallForce = 14 / (4 * 0.154)  = 22.7 N per wheel
#   kS = friction / stallForce    -> friction   = 0.11265 * 22.7     = 2.56 N per wheel
# Each run prints the kS/kV/kA of whatever is configured, to compare with the OpMode's constants.

# --- Chassis -----------------------------------------------------------------------------------
robot.massKg=14.0
# Yaw moment of inertia; a uniform 0.43 m square of 14 kg is m(a^2 + b^2) / 12 = 0.43.
robot.inertiaKgM2=0.43
# Wheel distance from the robot center, same meaning as lX / lY in MecanumDrive.
robot.lXmm=140.25
robot.lYmm=221.75
# Frame size, for wall collisions and the drawing.
robot.lengthMm=430
robot.widthMm=430

# --- Drive motors (per wheel, at the wheel surface, 12 V) -------------------------------------------
motor.freeSpeedMmPerSec=2252
motor.stallForceN=22.7
# goBILDA 5203 stall current at 12 V, for battery sag.
motor.stallCurrentA=9.2
# Rolling + gearbox friction. Below the deadband speed a wheel counts as stuck (static friction).
motor.frictionN=2.56
motor.frictionDeadbandMmPerSec=0.05
# Encoder counts per output revolution (goBILDA 435 rpm) and wheel radius (104 mm wheel).
motor.ticksPerRev=384.5
wheel.radiusMm=52
# Zero-power behavior before the OpMode sets one: BRAKE or FLOAT.
motor.defaultZeroPowerBehavior=BRAKE
# Mecanum rollers lose force when strafing; 1.0 would strafe as well as it drives.
drive.strafeEfficiency=0.85

# How each motor is mounted: +1 = positive power with Direction.FORWARD turns that wheel forward,
# -1 = mirrored. The tuning OpModes reverse the left side and drive forward, so on this robot the
# left motors are the mirrored ones.
mount.leftFront=-1
mount.leftBack=-1
mount.rightFront=1
mount.rightBack=1

# --- Battery ------------------------------------------------------------------------------------------
# Terminal voltage = open circuit - internal resistance * current drawn by the drive.
battery.openCircuitVolts=13.0
battery.internalOhms=0.08

# --- Hardware map names (what the OpMode passes to hardwareMap.get) ----------------------------------
hw.leftFront=leftFront
hw.rightFront=rightFront
hw.leftBack=leftBack
hw.rightBack=rightBack
hw.pinpoint=localizer
hw.voltageSensor=Control Hub

# --- goBILDA Pinpoint -----------------------------------------------------------------------------
# Pod noise grows with distance (random walk), heading drifts slowly, reads jitter a little.
pinpoint.noiseMmPerSqrtM=0.3
pinpoint.headingDriftDegPerMin=0.05
pinpoint.readNoiseMm=0.02
pinpoint.readNoiseDeg=0.02
pinpoint.velocityNoiseMmPerSec=2.0

# --- Field ------------------------------------------------------------------------------------------
# Origin at the field center; +X / +Y match the Pinpoint frame at heading 0.
field.sizeMm=3657.6
field.walls=true
start.xMm=0
start.yMm=0
start.headingDeg=0

# --- Timing ----------------------------------------------------------------------------------------
# Simulated time moves when the OpMode talks to hardware, like the Control Hub's bus. Approximate
# cost of one transaction; together they set the loop rate.
io.motorWriteMs=1.8
io.motorReadMs=1.8
io.voltageReadMs=1.8
io.pinpointUpdateMs=2.5
io.pinpointWriteMs=1.0
# SDK work between loop() calls; the cost of idle() / opModeIsActive() etc. in a LinearOpMode.
timing.loopOverheadMs=1.0
timing.idleMs=1.0
timing.physicsStepMs=0.5

# --- Run ---------------------------------------------------------------------------------------------
# Time between INIT and START.
sim.initSeconds=1.0
# How long a LinearOpMode may keep running after stop before it's killed.
sim.stopGraceSeconds=1.0
# Keep simulating after the OpMode stops (motors at 0) to see where the robot ends up.
sim.settleSeconds=0.5
sim.recordIntervalMs=10
sim.seed=1
